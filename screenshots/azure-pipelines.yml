trigger:
  branches:
    include:
      - main

variables:
  acrLoginServer: 'devopslablwr27.azurecr.io'
  imageName: 'flask-app'
  aksName: 'devops-lab-aks'
  resourceGroup: 'devops-lab-rg'
  azureServiceConnection: 'devops-lab-sc'

stages:

  # -----------------------------------------------------------------------
  # Stage 1 — Build and push Docker image to ACR
  # -----------------------------------------------------------------------
  - stage: Build
    displayName: 'Build and Push'
    jobs:
      - job: BuildPush
        displayName: 'Docker build -> ACR'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'ACR login and push'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # Get ACR credentials and login
                ACR_USERNAME=$(az acr credential show --name devopslablwr27 --query username -o tsv)
                ACR_PASSWORD=$(az acr credential show --name devopslablwr27 --query passwords[0].value -o tsv)
                docker login devopslablwr27.azurecr.io -u $ACR_USERNAME -p $ACR_PASSWORD

                # Build and push
                docker build -t devopslablwr27.azurecr.io/flask-app:$(Build.BuildId) .
                docker push devopslablwr27.azurecr.io/flask-app:$(Build.BuildId)
                docker tag devopslablwr27.azurecr.io/flask-app:$(Build.BuildId) devopslablwr27.azurecr.io/flask-app:latest
                docker push devopslablwr27.azurecr.io/flask-app:latest

  # -----------------------------------------------------------------------
  # Stage 2 — Deploy to staging
  # -----------------------------------------------------------------------
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: Build
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy -> staging namespace'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(resourceGroup) \
                        --name $(aksName) \
                        --overwrite-existing

                - task: Bash@3
                  displayName: 'Create staging namespace'
                  inputs:
                    targetType: inline
                    script: |
                      kubectl get namespace staging || kubectl create namespace staging

                - task: Bash@3
                  displayName: 'Apply staging manifest'
                  inputs:
                    targetType: inline
                    script: |
                      sed -i "s|\$(Build.BuildId)|${BUILD_BUILDID}|g" k8s/staging.yaml
                      kubectl apply -f k8s/staging.yaml
                  env:
                    BUILD_BUILDID: $(Build.BuildId)

                - task: Bash@3
                  displayName: 'Health check - staging'
                  inputs:
                    targetType: inline
                    script: |
                      chmod +x scripts/health-check.sh
                      ./scripts/health-check.sh staging

  # -----------------------------------------------------------------------
  # Stage 3 — Deploy to production (manual approval gate)
  # -----------------------------------------------------------------------
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy -> production namespace'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks get-credentials \
                        --resource-group $(resourceGroup) \
                        --name $(aksName) \
                        --overwrite-existing

                - task: Bash@3
                  displayName: 'Create production namespace'
                  inputs:
                    targetType: inline
                    script: |
                      kubectl get namespace production || kubectl create namespace production

                - task: Bash@3
                  displayName: 'Apply production manifest'
                  inputs:
                    targetType: inline
                    script: |
                      sed -i "s|\$(Build.BuildId)|${BUILD_BUILDID}|g" k8s/production.yaml
                      kubectl apply -f k8s/production.yaml
                  env:
                    BUILD_BUILDID: $(Build.BuildId)

                - task: Bash@3
                  displayName: 'Health check - production'
                  inputs:
                    targetType: inline
                    script: |
                      chmod +x scripts/health-check.sh
                      ./scripts/health-check.sh production
