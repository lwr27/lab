# Azure DevOps pipeline — mirrors GitHub Actions deploy.yml
# Triggers on changes to main branch, excludes infrastructure and config files

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - terraform/**
      - README.md
      - screenshots/**
      - scripts/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  acrName: 'platformlablwr27'
  acrLoginServer: 'platformlablwr27.azurecr.io'
  aksResourceGroup: 'platform-lab-rg'
  aksClusterName: 'platform-lab-aks'
  imageName: 'myapp'

stages:

  # Stage 1 — Build and push Docker image to ACR
  - stage: Build
    displayName: 'Build and Push'
    jobs:
      - job: BuildAndPush
        displayName: 'Build and push Docker image'
        steps:
          - task: AzureCLI@2
            displayName: 'Login to ACR and build image'
            inputs:
              azureSubscription: 'azure-service-connection'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az acr login --name $(acrName)
                docker build -t $(acrLoginServer)/$(imageName):$(Build.BuildId) .
                docker push $(acrLoginServer)/$(imageName):$(Build.BuildId)

  # Stage 2 — Deploy to staging
  - stage: DeployStaging
    displayName: 'Deploy to Staging'
    dependsOn: Build
    jobs:
      - deployment: DeployStaging
        displayName: 'Deploy to staging namespace'
        environment: 'staging'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: 'azure-service-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName)

                - task: KubernetesManifest@1
                  displayName: 'Deploy to staging'
                  inputs:
                    action: 'deploy'
                    namespace: 'staging'
                    manifests: 'k8s/staging.yaml'
                    containers: '$(acrLoginServer)/$(imageName):$(Build.BuildId)'

                - task: Bash@3
                  displayName: 'Health check staging'
                  inputs:
                    filePath: 'scripts/health-check.sh'
                    arguments: 'staging'

  # Stage 3 — Deploy to production with approval gate
  - stage: DeployProduction
    displayName: 'Deploy to Production'
    dependsOn: DeployStaging
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to production namespace'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Get AKS credentials'
                  inputs:
                    azureSubscription: 'azure-service-connection'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      az aks get-credentials --resource-group $(aksResourceGroup) --name $(aksClusterName)

                - task: KubernetesManifest@1
                  displayName: 'Deploy to production'
                  inputs:
                    action: 'deploy'
                    namespace: 'production'
                    manifests: 'k8s/production.yaml'
                    containers: '$(acrLoginServer)/$(imageName):$(Build.BuildId)'

                - task: Bash@3
                  displayName: 'Health check production'
                  inputs:
                    filePath: 'scripts/health-check.sh'
                    arguments: 'production'
